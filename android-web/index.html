<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>StreamTube</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { max-width: 320px; text-align: center; }
      .mark { width: 56px; height: 42px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 12px; background: #d92532; }
      .mark svg { width: 23px; height: 23px; fill: white; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
      p { margin: 12px 0 0; color: #a1a1aa; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" /></svg>
      </div>
      <h1>StreamTube</h1>
      <p>Connect to the internet to explore and watch videos.</p>
    </main>
  </body>
</html>
